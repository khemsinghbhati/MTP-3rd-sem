name: Published BST85 linear construction research
on:
  push:
    branches: [main, research/a2-linear-st-construction]
  workflow_dispatch:
jobs:
  validate-linear-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        run: cmake -S . -B build-linear -DCMAKE_BUILD_TYPE=Release -DMTP_BUILD_BENCHMARKS=ON
      - name: Compile focused tests
        run: cmake --build build-linear --target mtp_a2_linear_insert_tests mtp_st_linear_forest_tests mtp_bst85_linear_tests mtp_globally_biased_tests mtp_worst_case_forest_tests mtp_ibarra_a2_tests mtp_a2_two_hub_stress -j 4
      - name: Verify BST85 Figure 15 linear builder
        run: ctest --test-dir build-linear --output-on-failure -R bst85_linear_global_bias
      - name: Verify ST1983 size-partition linear forest build
        run: ctest --test-dir build-linear --output-on-failure -R st1983_linear_forest_construction
      - name: Verify Sleator Tarjan dynamic forest
        run: ctest --test-dir build-linear --output-on-failure -R sleator_tarjan_1983_dynamic_forest
      - name: Verify O(n) Ibarra A2 insertion with exact ST static rebuilding
        run: ctest --test-dir build-linear --output-on-failure -R ibarra_a2_linear_insert
      - name: Verify Ibarra A2
        run: ctest --test-dir build-linear --output-on-failure -R ibarra_section5_actual_ST_dynamic_tree
      - name: Print instrumented adversarial two-hub O(n) reconstruction
        run: ./build-linear/mtp_a2_two_hub_stress
  sanitizer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compile focused memory safety tests
        run: cmake --build build-asan --target mtp_a2_linear_insert_tests mtp_st_linear_forest_tests mtp_bst85_linear_tests mtp_ibarra_a2_tests -j 2
      - name: Test source-aligned linear ST builders under sanitizers
        run: ctest --test-dir build-asan --output-on-failure -R 'bst85_linear_global_bias|st1983_linear_forest_construction|ibarra_a2_linear_insert'
      - name: Test A2 against A1 under sanitizers
        run: ctest --test-dir build-asan --output-on-failure -R ibarra_section5_actual_ST_dynamic_tree
