name: Research A2 / Sleator–Tarjan (Release verification)
on:
  push:
    branches:
      - research/sleator-tarjan-worst-case
  workflow_dispatch:

jobs:
  verify-st-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release (full differential tests)
        run: cmake -S . -B build-a2 -DCMAKE_BUILD_TYPE=Release -DMTP_BUILD_BENCHMARKS=ON
      - name: Build ST and A2 tests
        run: cmake --build build-a2 --target mtp_worst_case_forest_tests mtp_globally_biased_tests mtp_ibarra_a2_tests mtp_a2_cli mtp_a2_operation_audit -j 4
      - name: Validate original ST globally biased dynamic forest
        run: ctest --test-dir build-a2 --output-on-failure -R sleator_tarjan_1983_dynamic_forest
      - name: Validate Ibarra A2 against independent A1
        run: ctest --test-dir build-a2 --output-on-failure -R ibarra_section5_actual_ST_dynamic_tree
      - name: Validate A2 and A2+ command-line integration
        run: ctest --test-dir build-a2 --output-on-failure -R 'ibarra_a2_sample_cli|ibarra_a2_fast_delete_sample_cli'
      - name: Audit worst-case Insert dynamic-tree operation counts
        run: ./build-a2/mtp_a2_operation_audit
