name: C++ build and verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard GitHub math compatibility
        shell: bash
        run: |
          if grep -R -n -F '\operatorname' docs/ README.md; then
            echo 'Unsupported GitHub math macro detected. Prefer \\mathrm for named functions.'
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sample CLI
        run: ./build/mtp_cli data/example_7_vertices.txt
