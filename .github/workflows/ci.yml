name: C++ build and verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub Markdown math syntax
        run: python3 scripts/check_markdown_math.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMTP_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sample CLI
        run: ./build/mtp_cli data/example_7_vertices.txt
