name: C++ build and verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub Markdown math syntax
        run: python3 scripts/check_markdown_math.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMTP_BUILD_BENCHMARKS=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j 2
      - name: Validate published ST dynamic-forest semantics first
        run: ctest --test-dir build --output-on-failure -R sleator_tarjan_1983_dynamic_forest
      - name: Validate Ibarra A2 against A1 oracle
        run: ctest --test-dir build --output-on-failure -R ibarra_section5_actual_ST_dynamic_tree

      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sample CLI
        run: ./build/mtp_cli data/example_7_vertices.txt

      - name: Run reproducible Section 4 benchmark (star graphs)
        run: ./build/mtp_benchmarks

      - name: Compare Section 5 indexed and first-implementation queries
        run: ./build/mtp_benchmark_indexed
